# codecov.yml for holmgard-lore-mcp
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

ignore:
  - "static/**"
  - "vendor-src/**"
  - "test/**"
  - "*.config.*"
  - "wrangler.toml"
  - "node_modules/**"

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: yes