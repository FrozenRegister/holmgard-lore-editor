# codecov.yml for holmgard-lore-editor
#
# Coverage policy: 80% patch target — this is a SvelteKit frontend.
# UI code (Svelte components, event handlers) is harder to achieve 100% coverage; 80% is practical.
#
# Sister repo: holmgard-lore-mcp uses 100% patch (backend Worker, stricter).
# Both repos pin codecov/codecov-action@v5 — update both CI files together when upgrading.
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false

ignore:
  - "static/**"
  - "vendor-src/**"
  - "test/**"
  - "*.config.*"
  - "wrangler.toml"
  - "node_modules/**"

comment:
  layout: "header, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: yes