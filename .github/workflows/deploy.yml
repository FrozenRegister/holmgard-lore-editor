name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch vendor files
        run: pnpm run vendor:fetch
        env:
          VENDOR_SOURCE_MANIFEST: ${{ secrets.VENDOR_SOURCE_MANIFEST }}

      - name: Bundle vendor files
        run: pnpm run vendor:bundle

      - name: Build
        run: vite build

      - name: Deploy to Pages
        run: npx wrangler pages deploy build/ --project-name holmgard-lore-editor --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 101b191e0347791e9060fe63a9c8ff04
