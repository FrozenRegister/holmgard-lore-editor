name: PR Quality Checks

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, edited]

permissions:
  pull-requests: read
  contents: read

jobs:
  check-merge-conflicts:
    name: Merge Conflicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for merge conflicts
        run: |
          # Fetch the base branch to compare against
          git fetch origin ${{ github.base_ref }}

          # Try to merge-base check
          if ! git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD; then
            echo "⚠️ WARNING: This branch is not based on the latest ${{ github.base_ref }}"
            echo "You may need to rebase to resolve conflicts"

            # Check if there would be conflicts. Stderr is intentionally left
            # visible (not redirected) so a non-conflict git failure here is
            # debuggable instead of silently misreported as a real conflict.
            # `git merge --abort` is best-effort: if the test-merge above failed
            # before ever creating MERGE_HEAD (a non-conflict git error, not a
            # content conflict), there is nothing to abort and this must not
            # crash the step.
            if ! git merge --no-commit --no-ff origin/${{ github.base_ref }}; then
              git merge --abort || true
              echo ""
              echo "ERROR: Merge conflicts detected with ${{ github.base_ref }}"
              echo ""
              echo "**To fix locally:**"
              echo "\`\`\`bash"
              echo "git fetch origin && git rebase origin/${{ github.base_ref }}"
              echo "# Resolve conflicts, then:"
              echo "git rebase --continue"
              echo "git push -u origin HEAD --force-with-lease"
              echo "\`\`\`"
              exit 1
            else
              git merge --abort || true
              echo "OK: No conflicts detected, but branch needs rebase to be current"
            fi
          else
            echo "OK: Branch is up-to-date with ${{ github.base_ref }}"
          fi

  check-vendor-integrity:
    name: Vendor Integrity
    runs-on: ubuntu-latest
    # NOTE: continue-on-error must be on the checksum step itself, not the job.
    # Job-level continue-on-error only stops the overall *workflow run* from
    # failing — the job's own check-run conclusion still reports 'failure',
    # which auto-merge.yml treats as blocking. Step-level continue-on-error
    # rewrites the step's conclusion to 'success' (outcome still reflects the
    # real result), which is what actually makes this check non-blocking.
    # Same drift check as ci.yml's "Vendor Integrity Check" job — kept
    # advisory here too rather than duplicating its issue-filing logic.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-quality-checks') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm and dependencies
        run: npm install -g pnpm@11.5.1 && pnpm install --frozen-lockfile
      - name: Fetch vendor files from R2
        run: pnpm run vendor:fetch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: holmgard-vendor-files
      - name: Verify checksums
        continue-on-error: true
        run: pnpm run vendor:check

  check-issue-link:
    name: Issue Link
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })

            if (pr.labels.some(l => l.name === 'skip-quality-checks')) {
              console.log('Skipping (skip-quality-checks label present)')
              return
            }

            const body = pr.body || ''
            // Accept both same-repo (#123) and cross-repo (owner/repo#123) references
            const hasLink = /\b(closes?|fixes?|resolves?)\s+([\w.-]+\/[\w.-]+#\d+|#\d+)/i.test(body)
            if (!hasLink) {
              core.setFailed(
                'ERROR **Issue link required**\n\n' +
                'The PR body must contain a closing keyword referencing an issue:\n' +
                '  - `Closes #123` (same repo)\n' +
                '  - `Closes owner/repo#123` (cross-repo)\n' +
                '  - `Fixes #456`\n\n' +
                'Note: keywords in the PR *title* are ignored by GitHub — they must be in the body.\n\n' +
                'If this PR has no related issue, apply the `skip-quality-checks` label.'
              )
            } else {
              console.log('OK Issue link found in PR body')
            }

  check-docs:
    name: Documentation
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-quality-checks') }}
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })

            const hasDocs = files.some(f => f.filename.startsWith('docs/'))
            const prBody = pr.body || ''
            const hasDocsSection = prBody.includes('## Documentation')

            if (!hasDocs && !hasDocsSection) {
              core.setFailed(
                'ERROR **Documentation required**\n\n' +
                'Every PR must either:\n' +
                '  1. Modify files under `docs/`, OR\n' +
                '  2. Include a `## Documentation` section in the PR body describing changes\n\n' +
                'If you are skipping this check for an emergency hotfix, apply the `skip-quality-checks` label.'
              )
            } else {
              console.log('OK Documentation found in PR')
            }

  check-changelog:
    name: Changelog Fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })

            if (pr.labels.some(l => l.name === 'skip-quality-checks')) {
              console.log('Skipping (skip-quality-checks label present)')
              return
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            })

            const srcChanged = files.some(f =>
              f.filename.startsWith('src/') ||
              f.filename.startsWith('src-tauri/') ||
              f.filename.startsWith('docs/') ||
              f.filename === 'CLAUDE.md'
            )
            if (!srcChanged) {
              console.log('No source/docs changes — changelog fragment not required')
              return
            }

            const hasFragment = files.some(f =>
              f.filename.startsWith('.changelog/fragments/') && f.status !== 'removed'
            )
            if (!hasFragment) {
              core.setFailed(
                'ERROR **Changelog fragment required**\n\n' +
                'PRs that modify `src/`, `src-tauri/`, `docs/`, or `CLAUDE.md` must add\n' +
                'a fragment file under `.changelog/fragments/`.\n\n' +
                'Create a file like `.changelog/fragments/my-feature.md` with a brief description.\n' +
                'Fragments are assembled into CHANGELOG.md at release time — no merge conflicts.\n\n' +
                'For emergency hotfixes, apply the `skip-quality-checks` label.'
              )
            } else {
              console.log('OK Changelog fragment found')
            }

  trigger-auto-merge:
    name: Trigger Auto-Merge Check
    needs: [check-merge-conflicts, check-vendor-integrity, check-issue-link, check-docs, check-changelog]
    # workflow_run only reliably fires for push-triggered runs, not pull_request-triggered
    # ones (see auto-merge.yml) — dispatching directly here is the reliable fast path;
    # the 15-min cron in auto-merge.yml remains as a fallback if this ever fails to fire.
    if: always() && contains(github.event.pull_request.labels.*.name, 'auto-merge')
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch auto-merge sweep
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-merge.yml',
              ref: context.payload.repository.default_branch,
            })
