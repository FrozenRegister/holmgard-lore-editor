name: Agent Trigger

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    # Only run when an agent:* label is applied (and not in response to a comment we just posted)
    if: startsWith(github.event.label.name, 'agent:')

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue
            const agent = context.payload.label.name  // e.g. "agent:claude"

            // Check if we've already posted a work-order comment (to avoid duplicate comments)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issue.number,
            })

            const alreadyPosted = comments.some(c =>
              c.user.login === 'github-actions[bot]' && c.body.includes('## Work Order')
            )

            if (alreadyPosted) {
              console.log(`Issue #${issue.number}: work-order already posted, skipping`)
              return
            }

            // Extract issue number and create kebab-case slug from title
            const issueNum = issue.number
            const slug = issue.title
              .toLowerCase()
              .trim()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-|-$/g, '')
              .slice(0, 50)

            const branchName = `issue/${issueNum}-${slug}`

            // Post work-order comment using string concatenation (to avoid YAML parsing issues)
            const workOrder = '## Work Order [WORKORDER]\n\n' +
              'Issue: #' + issueNum + '\n' +
              'Assigned to: ' + agent + '\n' +
              'Branch: `' + branchName + '`\n\n' +
              '---\n\n' +
              '### Implementation Workflow\n\n' +
              'This automation workflow applies to **all** GitHub issues and pull requests. Follow these steps:\n\n' +
              '#### Phase 1: Understand the Issue\n' +
              '1. Read the full issue, including all comments.\n' +
              '2. Summarize the problem in 3–5 bullet points.\n' +
              '3. Create a feature branch: `' + branchName + '`\n\n' +
              '#### Phase 2: Analyze & Plan\n' +
              '4. Locate all relevant files in the codebase.\n' +
              '5. Outline a step-by-step implementation plan.\n' +
              '6. Consider architectural consistency and existing patterns.\n\n' +
              '#### Phase 3: Implement\n' +
              '7. Modify existing code or create new files as needed.\n' +
              '8. Maintain architectural consistency with the project.\n' +
              '9. Remove obsolete code; avoid over-engineering.\n\n' +
              '#### Phase 4: Test\n' +
              '10. Add or update tests to cover the fix (unit + integration).\n' +
              '11. Run the full test suite: `pnpm test`\n' +
              '12. Fix any failures — do not move forward with broken tests.\n\n' +
              '#### Phase 5: Quality\n' +
              '13. Review code for clarity and consistency.\n' +
              '14. Ensure no dead code or poor naming.\n' +
              '15. Format consistently with the project.\n\n' +
              '#### Phase 6: Documentation\n' +
              '16. Update all relevant documentation:\n' +
              '    - README sections if applicable\n' +
              '    - API/interface documentation\n' +
              '    - Architecture notes\n' +
              '    - Any diagrams affected\n\n' +
              '17. Update the GitHub Issue:\n' +
              '    - Post a detailed comment with what was changed\n' +
              '    - Include links to relevant commits\n' +
              '    - Note tests added/updated\n' +
              '    - Document architectural considerations\n\n' +
              '#### Phase 7: Pull Request\n' +
              '18. Create a clean commit history:\n' +
              '    - Logical commits\n' +
              '    - Clear messages\n' +
              '    - No noise commits\n\n' +
              '19. Open a Pull Request:\n' +
              '    - Clear title\n' +
              '    - Summary of the issue\n' +
              '    - Explanation of the fix\n' +
              '    - Notes on tests added/updated\n' +
              '    - Documentation updates performed\n' +
              '    - Marked as "Ready for Review"\n\n' +
              '---\n\n' +
              '### Key Requirements\n\n' +
              'Testing: Write tests alongside any new tools or changes. Both vitest and Pester test suites must be updated.\n\n' +
              'Documentation: Every PR must update relevant docs. This is enforced by the PR quality check.\n\n' +
              'CI Checks: TypeScript, linting, and tests must pass. CI failures block merges.\n\n' +
              'Architectural: Follow existing patterns in `src/`. Reuse utilities and helpers. Avoid premature abstraction.\n\n' +
              'Good luck!'

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: issueNum,
              body: workOrder,
            })

            console.log(`Issue #${issueNum}: work-order posted (${agent})`)
