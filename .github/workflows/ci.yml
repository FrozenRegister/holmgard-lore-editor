name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.1'

jobs:
  vendor-check:
    name: Vendor Integrity Check
    runs-on: ubuntu-latest
    # Advisory only — upstream drift at hexatlas.net doesn't affect the running app
    # (new files aren't pulled in until `pnpm vendor:sync` runs and its PR merges),
    # so a mismatch here must never block unrelated PRs from merging.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch vendor files from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: holmgard-vendor-files
        run: pnpm vendor:fetch

      - name: Verify vendor checksums
        id: check
        continue-on-error: true
        run: pnpm vendor:check

      - name: Annotate drift (advisory, non-blocking)
        if: steps.check.outcome == 'failure'
        run: echo "::warning::Vendor checksums drifted from vendor-manifest.json — advisory only, does not block merge. See the auto-filed tracking issue (or run 'pnpm vendor:sync')."

      - name: File tracking issue for vendor drift (idempotent — skips if one is already open)
        if: steps.check.outcome == 'failure'
        continue-on-error: true # never block a PR on issue-filing itself failing (e.g. label race)
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Vendor files drifted from manifest - run pnpm vendor:sync'
            const existing = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"`,
            })
            if (existing.data.total_count > 0) {
              console.log(`Tracking issue already open: #${existing.data.items[0].number} — skipping (idempotent)`)
              return
            }
            const body = [
              'One or more vendor files (pulled from hexatlas.net via the private R2 bucket) have a checksum mismatch against `vendor-manifest.json`.',
              '',
              `Detected during CI run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              "This does **not** affect the running app — the new upstream files aren't pulled into the app until `pnpm vendor:sync` runs and the resulting PR merges. The Vendor Integrity Check is advisory and will not block other PRs while this is open.",
              '',
              '## Fix',
              'Run the `Vendor Sync` workflow (`workflow_dispatch` on `vendor-sync.yml`), or wait for its weekly Monday run — it opens its own PR updating `vendor-manifest.json` with the new checksums.',
              '',
              'Close this issue once that PR merges. A new one will be filed automatically if drift is detected again afterward.',
            ].join('\n')

            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ['vendor-drift'],
                body,
              })
              console.log('Filed new vendor-drift tracking issue (with label).')
            } catch (err) {
              // Label may not exist yet if `Setup Labels` hasn't been run — retry unlabeled
              // rather than lose the tracking issue entirely.
              console.log(`Issue creation with label failed (${err.message}), retrying without label`)
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              })
              console.log('Filed new vendor-drift tracking issue (unlabeled).')
            }

  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run svelte-check (typecheck)
        run: pnpm check

  build:
    name: Build Verification
    needs: [vendor-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Build app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET_NAME: holmgard-vendor-files
        run: pnpm build

  unit-tests:
    name: Unit Tests
    needs: [vendor-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Run unit tests with coverage
        run: pnpm test:coverage -- --reporter=default --reporter=github-actions
        env:
          VITEST_POOL: forks

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          files: ./coverage/unit/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 7

  integration-tests:
    name: Integration Tests (Vitest)
    needs: [vendor-check]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync SvelteKit
        run: pnpm exec svelte-kit sync

      - name: Run integration tests
        run: pnpm test:integration -- --reporter=default --reporter=github-actions
        env:
          VITEST_POOL: forks

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          files: ./coverage/integration/lcov.info
          fail_ci_if_error: false
          verbose: true

  coverage-gate:
    name: Coverage Gate & Gap Analysis
    needs: [vendor-check, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download unit coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit
          path: ./coverage/unit
        continue-on-error: true

      - name: Run gap analysis
        run: npx tsx scripts/coverage-gap-analysis.ts
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload gap report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-gap-report
          path: coverage-gap-report/
          retention-days: 7

  notify:
    name: Notify on Failure
    needs: [vendor-check, lint-and-typecheck, build, unit-tests, integration-tests, coverage-gate]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create GitHub Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Failure on ${context.ref.replace('refs/heads/', '')}`,
              body: `The latest CI run failed on \`${context.ref.replace('refs/heads/', '')}\`.\n\nView logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            })
