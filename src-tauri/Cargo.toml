[package]
name = "holmgard-lore-editor"
version = "0.1.0"
description = "Holmgard Lore Editor"
authors = []
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri = { version = "1", features = [ "http-all",
  "path-all",
  "protocol-asset",
  "shell-open",
] }
keyring = "2"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
